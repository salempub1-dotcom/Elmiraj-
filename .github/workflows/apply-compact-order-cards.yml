name: Apply compact order cards

on:
  push:
    branches:
      - fix/admin-one-click-delivery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-one-click-delivery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: node scripts/apply-compact-order-cards.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Delivery integration checks
        run: node scripts/verify-delivery-integration.mjs
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No patch needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx scripts/verify-delivery-integration.mjs
          git commit -m "feat: compact expandable alternating order cards"
          git push origin HEAD:fix/admin-one-click-delivery
