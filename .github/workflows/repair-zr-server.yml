name: Repair ZR Server

on:
  push:
    branches: [feature/zrexpress-integration]
    paths:
      - scripts/repair-zr-server.mjs
      - .github/workflows/repair-zr-server.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/zrexpress-integration
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair ZR server code
        run: node scripts/repair-zr-server.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add lib/deliveryProviders.js api/noest.js
          git commit -m "fix: remove temporary ZR diagnostics and repair server module"
          git push origin HEAD:feature/zrexpress-integration
