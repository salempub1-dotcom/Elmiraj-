name: Patch ZR Required SKU

on:
  push:
    branches: [feature/zrexpress-integration]
    paths:
      - 'scripts/patch-zr-sku-required.mjs'
      - '.github/workflows/patch-zr-sku-required.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/zrexpress-integration
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ZR SKU patch
        run: node scripts/patch-zr-sku-required.mjs
      - name: Validate syntax and integration
        run: |
          node --check lib/deliveryProviders.js
          npm ci
          npm run build
          node scripts/verify-delivery-integration.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/deliveryProviders.js scripts/verify-delivery-integration.mjs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: provide required ZR product SKU"
            git push origin feature/zrexpress-integration
          fi
