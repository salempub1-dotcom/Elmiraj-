name: Truncate ZR Duplicate

on:
  push:
    branches: [feature/zrexpress-integration]
    paths:
      - scripts/truncate-zr-duplicate.mjs
      - .github/workflows/truncate-zr-duplicate.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/zrexpress-integration
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove duplicated trailing code
        run: node scripts/truncate-zr-duplicate.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add lib/deliveryProviders.js
          git commit -m "fix: remove duplicated trailing ZR provider code"
          git push origin HEAD:feature/zrexpress-integration
