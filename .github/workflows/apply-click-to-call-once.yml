name: One-shot Apply Click-to-Call

on:
  push:
    branches:
      - automation/click-to-call-apply

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: automation/click-to-call-apply
          fetch-depth: 0

      - name: Verify patch applies cleanly
        run: git apply --check clicktocall.patch

      - name: Apply click-to-call patch
        run: |
          git apply clicktocall.patch
          test "$(git hash-object src/App.tsx)" = "e391a9bcb129e7e362e0b5570376b1e7ac92a725"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Delivery integration safety checks
        run: node scripts/verify-delivery-integration.mjs

      - name: Commit only the product code change
        run: |
          rm -f clicktocall.patch .github/workflows/apply-click-to-call-once.yml
          git config user.name "Al Miraj Admin Bot"
          git config user.email "admin@elm3raj.com"
          git add -A
          git diff --cached --name-only
          test "$(git diff --cached --name-only)" = "src/App.tsx"
          git commit -m "feat(admin): add mobile click-to-call for customer phone numbers"
          git push origin HEAD:automation/click-to-call-apply
