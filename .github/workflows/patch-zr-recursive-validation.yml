name: Patch ZR Recursive Validation

on:
  push:
    branches: [feature/zrexpress-integration]
    paths:
      - 'scripts/patch-zr-recursive-validation.mjs'
      - '.github/workflows/patch-zr-recursive-validation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/zrexpress-integration
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply recursive validation formatter
        run: node scripts/patch-zr-recursive-validation.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/deliveryProviders.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: display nested ZR validation error paths"
            git push origin feature/zrexpress-integration
          fi
