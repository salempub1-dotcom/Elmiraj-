name: Apply Storefront Delivery Patch

on:
  push:
    branches: [feature/zrexpress-integration]
    paths:
      - scripts/apply-storefront-delivery-patch.mjs
      - .github/workflows/apply-storefront-delivery-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/zrexpress-integration
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/apply-storefront-delivery-patch.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add \
            lib/deliveryProviders.js \
            lib/deliveryOrchestrator.js \
            api/noest.js \
            api/admin/landing-pages.js \
            api/orders.js \
            src/components/admin/DeliveryProviderDialog.tsx \
            src/App.tsx
          git commit -m "feat: add storefront courier selection and admin visibility controls"
          git push origin HEAD:feature/zrexpress-integration
