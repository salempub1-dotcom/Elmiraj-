name: One-shot Compact Admin Order Polish

on:
  push:
    branches:
      - preview/admin-compact-order-polish

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: preview/admin-compact-order-polish
          fetch-depth: 0

      - name: Apply compact professional UI replacements
        run: python scripts/apply-admin-compact-polish.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Delivery integration safety checks
        run: node scripts/verify-delivery-integration.mjs

      - name: Commit product code and remove helper files
        run: |
          git config user.name "Al Miraj Admin Bot"
          git config user.email "admin@elm3raj.com"
          git rm .github/workflows/apply-admin-compact-polish-once.yml scripts/apply-admin-compact-polish.py
          git add src/App.tsx
          git diff --cached --name-status
          git commit -m "feat(admin): compact phone price and product badges"
          git push origin HEAD:preview/admin-compact-order-polish
