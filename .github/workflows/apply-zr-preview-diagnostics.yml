name: Apply ZR Preview Diagnostics

on:
  push:
    branches: [feature/zrexpress-integration]
    paths:
      - scripts/apply-zr-preview-diagnostics.mjs
      - .github/workflows/apply-zr-preview-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/zrexpress-integration
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply diagnostics patch
        run: node scripts/apply-zr-preview-diagnostics.mjs
      - name: Commit diagnostics hook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add lib/deliveryProviders.js api/noest.js
          git commit -m "chore: expose safe ZR workflow diagnostics in preview"
          git push origin HEAD:feature/zrexpress-integration
