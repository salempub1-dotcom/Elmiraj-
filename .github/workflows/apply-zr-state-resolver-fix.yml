name: Apply ZR Workflow Resolver Fix

on:
  push:
    branches: [feature/zrexpress-integration]
    paths:
      - scripts/apply-zr-state-resolver-fix.mjs
      - .github/workflows/apply-zr-state-resolver-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/zrexpress-integration
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply workflow resolver patch
        run: node scripts/apply-zr-state-resolver-fix.mjs
      - name: Commit resolver fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add lib/deliveryProviders.js scripts/verify-delivery-integration.mjs
          git commit -m "fix: resolve ZR ReadyToDispatch across workflow response shapes"
          git push origin HEAD:feature/zrexpress-integration
