name: Validate Current ZR

on:
  push:
    branches: [feature/zrexpress-integration]
    paths:
      - '.github/workflows/validate-current-zr.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/zrexpress-integration
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Delivery integration safety checks
        run: node scripts/verify-delivery-integration.mjs
