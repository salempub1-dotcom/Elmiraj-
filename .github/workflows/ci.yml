name: Build Validation

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Delivery integration safety checks
        run: node scripts/verify-delivery-integration.mjs

      # Diagnostic only: Vercel Preview Authentication may intentionally return
      # its HTML login page. If the preview is public, validate provider config;
      # if it is protected, do not turn an access-control policy into a false
      # code failure. This step never calls delivery_send/create_order.
      - name: Inspect Vercel preview configuration (read-only)
        env:
          PREVIEW_BASE: https://elmiraj-git-feature-zrexpress-integration-elmiraj1.vercel.app
        run: |
          set -euo pipefail
          : > /tmp/preview-body
          status="$(curl -L -sS --max-time 15 -o /tmp/preview-body -w '%{http_code}' "$PREVIEW_BASE/api/noest" 2>/dev/null || true)"
          body="$(cat /tmp/preview-body)"

          if echo "$body" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "$body" | jq '{ok, message, env: {NOEST_API_TOKEN: .env.NOEST_API_TOKEN, NOEST_USER_GUID: .env.NOEST_USER_GUID, ZREXPRESS_TENANT_ID: .env.ZREXPRESS_TENANT_ID, ZREXPRESS_API_KEY: .env.ZREXPRESS_API_KEY, ZREXPRESS_API_BASE: .env.ZREXPRESS_API_BASE, ZREXPRESS_API_VERSION: .env.ZREXPRESS_API_VERSION}}'
            response="$(curl -LfsS --max-time 15 \
              -H 'Content-Type: application/json' \
              -X POST "$PREVIEW_BASE/api/noest" \
              --data '{"action":"ping"}')"
            echo "$response" | jq '{ok, version, providers}'
            echo "$response" | jq -e '.ok == true and .providers.noest == true and .providers.zrexpress == true' >/dev/null
          else
            echo "ℹ️ Vercel preview is protected/unavailable to external CI (HTTP ${status:-000})."
            echo "Vercel deployment status remains the source of truth for preview deployment; skipping credential ping from GitHub Actions."
            exit 0
          fi
